<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Science Fair Harmony Analyzer</title>
    <style>
        body { 
            background: #2c3e50; 
            color: white; 
            font-family: "Arial", sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        #status-label {
            font-size: 24px;
            font-weight: bold;
            color: #bdc3c7;
            margin: 10px 0;
        }
        #notes-label {
            font-size: 20px;
            font-weight: bold;
            color: #f1c40f;
            margin: 5px 0 15px 0;
        }
        /* The graph container matches your Python grey/white layout */
        #graph-container {
            width: 100%;
            height: 250px;
            background: white;
            border-radius: 4px;
            margin: 5px 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
        }
        /* Mathematical Analysis Box matching Python's sunken look */
        #text-breakdown {
            background: #1a252f;
            color: #2ecc71;
            font-family: "Courier", monospace;
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            padding: 20px;
            margin: 20px 0;
            border: 5px solid #111a22;
            border-radius: 4px;
            min-height: 120px;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        /* Red Record Button matching Python graphics */
        #record-btn {
            background: #e74c3c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        #record-btn:active {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Piano Harmony Analyzer</h1>
        <div id="status-label">Press 'Record' and play a chord</div>
        <div id="notes-label">Notes: None</div>
        
        <div id="graph-container">
            <canvas id="waveCanvas"></canvas>
        </div>

        <div id="text-breakdown">Mathematical analysis will show here...</div>

        <button id="record-btn">🔴 RECORD PIANO</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
